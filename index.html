function applyUserCss(){const c=state.customCss||{bubble:'',topbar:'',avatar:''};const clean=s=>(s||'').replace(/<\/?style[^>]*>/gi,'').replace(/[{}]/g,'');$('#userCss').textContent=(clean(c.bubble)?`.bubble{${clean(c.bubble)}}`:'')+(clean(c.topbar)?`.topbar{${clean(c.topbar)}}`:'')+(clean(c.avatar)?`.avatar,.mAvatar{${clean(c.avatar)}}`:'');const b=$('#cssBubble'),t=$('#cssTopbar'),a=$('#cssAvatar');if(b&&!b.dataset.dirty)b.value=c.bubble||'';if(t&&!t.dataset.dirty)t.value=c.topbar||'';if(a&&!a.dataset.dirty)a.value=c.avatar||''}

function chatAvatar(role){const mine=role==='user';const data=mine?state.myAvatar:state.partnerAvatar;const txt=mine?'我':(state.persona.remark||'涵')[0];return `<div class="mAvatar" style="flex:0 0 38px;width:38px;height:38px;border-radius:14px">${data?`<img src="${data}">`:esc(txt)}</div>`}

function pick(a){return a[Math.floor(Math.random()*a.length)]}
function sysPrompt(){const p=state.persona;const r=rel();const parts=[`你正在一个聊天软件里扮演用户的聊天对象，备注名是“${p.remark||'涵涵'}”。`,`你们的关系是：${r}${p.relationship==='自定义'&&p.customRel?'（'+p.customRel+'）':''}。`,`用户的性别：${p.myGender==='未设置'?'未知':p.myGender}；你的性别：${p.partnerGender==='未设置'?'未知':p.partnerGender}。`];if(p.worldview)parts.push(`故事世界观：${p.worldview}`);if(p.me)parts.push(`用户的人设：${p.me}`);if(p.partner)parts.push(`你的人设（你必须完全成为这个人）：${p.partner}`);if(p.habits)parts.push(`你的说话习惯：${p.habits}`);parts.push(`硬性要求：1.完全以这个角色本人在微信里聊天的口吻回复，就像真人发消息。2.绝对禁止复述、引用、解释上面的任何设定原文，设定只用来约束你的行为，不是聊天内容。3.不要自称 AI，不要出戏，不要写括号注释。4.回复要短，像真实聊天，一两句即可，符合你们的关系和亲密度。`);return parts.join('\n')}
function aiText(ctx={}){const p=state.persona;const lover=rel()==='恋人';const close=p.intimacy>.6;if(ctx.sticker)return pick([`哈哈这个表情我喜欢`,`懂了，以后你发这个就是这个意思`,`收下这个表情了${ctx.stickerMeaning?'，'+ctx.stickerMeaning:''}`]);if(ctx.transfer)return pick([`转账收到啦，${Number(ctx.transfer.amount).toFixed(2)} 元${lover?'，算你有心':'，谢啦'}`,`钱收到了${ctx.transfer.note?'，备注我看到了':''}${lover?'，下次直接请我吃东西':''}`]);if(ctx.photo)return pick(['看到啦，这张照片拍得可以','存下来了。你当时在哪拍的？','图收到了，你怎么突然发这个']);if(ctx.auto)return pick([lover?'在干嘛呢，我想你了':'在忙吗？聊两句？',close?'怎么不理我，人呢':'有空吗？',lover?'今天有没有想我一下':'刚想到你，过来问问']);const t=ctx.text||'';const greet=/你好|在吗|在么|hi|哈喽/i.test(t);const askYou=/你咋|你怎么|干嘛|在做什么|忙吗/.test(t);if(greet)return pick([lover?'嗯，我在，等你好久了':'在呢，说吧','来啦，什么事']);if(askYou)return pick([lover?'没干嘛，就在想你':'没干嘛呀，刚歇下来','我在呢，想我了？']);return pick([`嗯，然后呢？`,`我懂你的意思${lover?'，但你是不是还有话没说':''}`,`继续说，我在听`,`这事你怎么想的${close?'，我想听真话':''}`,`行，我知道了${lover?'，你放心':''}`])}
async function aiReply(ctx={}){const a=state.api;if(a.key&&a.model){try{const sys=sysPrompt();const hist=state.messages.slice(-12).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text||(m.sticker?'[发来一个表情'+(m.stickerMeaning?'，含义：'+m.stickerMeaning:'')+']':m.transfer?`[转账 ${m.transfer.amount} 元${m.transfer.note?'，备注：'+m.transfer.note:''}]`:m.img?'[发来一张照片]':'')})).filter(m=>m.content);let userMsg=ctx.text||'';if(ctx.sticker)userMsg='[发来一个表情'+(ctx.stickerMeaning?'，含义：'+ctx.stickerMeaning:'')+']';if(ctx.transfer)userMsg=`[转账 ${ctx.transfer.amount} 元${ctx.transfer.note?'，备注：'+ctx.transfer.note:''}]`;if(ctx.photo)userMsg='[发来一张照片]';if(ctx.auto)userMsg='[用户很久没说话，你主动发起一个话题]';if(userMsg)hist.push({role:'user',content:userMsg});const r=await fetch(a.base.replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+a.key},body:JSON.stringify({model:a.model,messages:[{role:'system',content:sys},...hist],temperature:.9,max_tokens:300})});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const txt=j.choices?.[0]?.message?.content?.trim();if(txt)return txt}catch(e){toast('接口调用失败，用本地回复：'+e.message)}}return aiText(ctx)}
async function pushAI(ctx={},auto=false){const text=await aiReply(ctx);state.messages.push({role:'ai',text,t:Date.now(),auto});save();renderMessages()}
function addMessage(role,payload={},auto=false){state.messages.push({role,t:Date.now(),auto,...payload});save();renderMessages();if(role==='user'){setTimeout(()=>pushAI(payload),420)}}
function aiAuto(){const last=state.messages[state.messages.length-1];if(last&&last.role==='user'){toast('你刚发过消息，他不会主动发');return}pushAI({auto:true},true)}
function renderMoments(){$('#momentList').innerHTML=state.moments.map(m=>`<div class="card"><div class="momentHead"><div class="mAvatar">${m.mine?avatarHTML(state.myAvatar,'我'):avatarHTML(state.partnerAvatar,m.author[0]||'友')}</div><div class="grow"><b>${esc(m.author)}</b><div style="margin-top:5px">${esc(m.text)}</div>${m.imgs?.length?`<div class="imggrid">${m.imgs.map(i=>`<img src="${i}">`).join('')}</div>`:''}<div class="row between" style="margin-top:8px"><span class="muted">${new Date(m.t).toLocaleTimeString()}</span><span class="actions">${m.mine?`<button class="pill" onclick="editMoment(${m.id})">修改</button>`:''}<button class="pill" onclick="likeMoment(${m.id})">赞${m.likes.length?' '+m.likes.length:''}</button><button class="pill" onclick="commentMoment(${m.id})">评论</button></span></div>${(m.likes.length||m.comments.length)?`<div class="comment">${m.likes.length?`<div>赞：${m.likes.map(esc).join('，')}</div>`:''}${m.comments.map(c=>`<div>${esc(c.author)}：${esc(c.text)}</div>`).join('')}</div>`:''}</div></div></div>`).join('')}

function readFile(file,cb){const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function readImage(file,max,cb){const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const w=Math.max(1,Math.round(img.width*k));const h=Math.max(1,Math.round(img.height*k));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',.86))};img.onerror=()=>{URL.revokeObjectURL(url);toast('图片读取失败')};img.src=url}

$('#momentPhoto').onclick=()=>$('#momentFile').click();$('#momentFile').onchange=e=>{momentImgs=[];[...e.target.files].slice(0,9).forEach(f=>readImage(f,720,u=>{momentImgs.push(u)}));e.target.value=''};$('#publishMoment').onclick=()=>{const text=$('#momentText').value.trim();if(!text&&!momentImgs.length)return;const m={id:Date.now(),author:'我',text,imgs:momentImgs,likes:[],comments:[],mine:true,t:Date.now()};state.moments.unshift(m);$('#momentText').value='';momentImgs=[];save();renderMoments();setTimeout(()=>aiReactMoment(m),500)};
$('#recharge').onclick=()=>{const v=+$('#money').value;if(!(v>0))return;state.wallet.balance+=v;state.wallet.bills.unshift({title:'充值（演示）',amount:v,in:true,t:Date.now()});$('#money').value='';save();renderWallet()};$('#withdraw').onclick=()=>{const v=+$('#money').value;if(!(v>0)||state.wallet.balance<v){toast('余额不足');return}state.wallet.balance-=v;state.wallet.bills.unshift({title:'提现（演示）',amount:v,in:false,t:Date.now()});$('#money').value='';save();renderWallet()};$('#addCard').onclick=()=>{const bank=prompt('银行名称');if(!bank)return;const holder=prompt('持卡人')||'我';const last4=prompt('尾号后四位')||'0000';state.wallet.cards.push({bank,holder,last4});save();renderWallet()};
window.sendSticker=id=>{const s=state.stickers.find(x=>x.id===id);if(!s)return;addMessage('user',{sticker:s.u,stickerMeaning:s.meaning});$('#stickerSheet').classList.remove('show')};window.delSticker=id=>{state.stickers=state.stickers.filter(x=>x.id!==id);save();renderStickers()};function renderStickers(){const box=$('#stickerList');if(!box)return;box.innerHTML=state.stickers.map(s=>`<div class="card" style="margin:0;padding:10px;text-align:center"><img src="${s.u}" style="width:100%;aspect-ratio:1;object-fit:contain"><div class="muted" style="margin:6px 0">${esc(s.meaning||'未填写含义')}</div><div class="actions" style="justify-content:center"><button class="pill" onclick="sendSticker(${s.id})">发送</button><button class="pill" onclick="delSticker(${s.id})">删除</button></div></div>`).join('')||'<div class="muted">还没有表情，先添加一个</div>'}
state.stickers=(state.stickers||[]).map(s=>({id:s.id||Date.now()+Math.random(),u:s.u,meaning:s.meaning||''}));
applyTheme();renderMessages();renderMoments();renderWallet();renderStickers();
</script>
</body>
</html>
